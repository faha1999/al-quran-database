name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Check Formatting
      run: npm run format -- --check || echo "Formatting check failed. Run 'npm run format' locally."
      
    - name: Run Linter
      run: npm run lint
      
    - name: Type Check
      run: npx tsc --noEmit
      
    - name: Run Tests
      run: npm run test
      
    - name: Build Application
      run: npm run build
