name: Good First Issue
description: A well-scoped, beginner-friendly task for new contributors
title: "[Good First Issue] "
labels: ["good first issue", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for picking up a good first issue! These tasks are intentionally small and low-risk.
        Read [CONTRIBUTING.md](../CONTRIBUTING.md) before opening a PR.

  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe what needs to be done
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context / Where to look
      description: Files, functions, or docs pages relevant to this task
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Contribution type
      options:
        - Documentation fix or improvement
        - Usage example
        - Typo / wording
        - Metadata / data addition
        - Test addition
    validations:
      required: true

  - type: checkboxes
    id: light-path
    attributes:
      label: Light contribution path
      options:
        - label: This issue qualifies for the light contribution path (skip e2e + build)
