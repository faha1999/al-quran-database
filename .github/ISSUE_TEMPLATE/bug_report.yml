name: Bug Report
description: Report something that is broken or behaving unexpectedly
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of the issue
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this? Include a minimal code snippet if possible.
      placeholder: |
        1. Import ...
        2. Call ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages or stack traces.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `npm list @faha1999/al-quran-database` or version from package.json
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Local data layer (getSurah / getAyah / searchAyahs etc.)
        - REST API
        - GraphQL API
        - SDK (QuranDevSDK)
        - Data / JSON content
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js version, OS, browser if applicable
